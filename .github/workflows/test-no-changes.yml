name: Test No Changes
on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      ref:
        description: "The fully-formed ref of the branch or tag that triggered the workflow run"
        required: false
        type: "string"
      sha:
        description: "The sha of the commit that triggered the workflow run"
        required: false
        type: "string"
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: base-ref
          fetch-depth: 0

      # There should be no changes
      - uses: ./
        id: current
        with:
          atmos-config-path: ./tests
          install-atmos: true
          skip-checkout: true
          # Set both the head and default branch to the PR branch.
          # We intentionally want to validate there are no changes
          head-ref: ${{ github.event.pull_request.head.ref }} 
          default-branch: ${{ github.event.pull_request.head.ref }}

    outputs:
      affected: "${{ steps.current.outputs.affected }}"
      has-affected-stacks: "${{ steps.current.outputs.has-affected-stacks }}"

  assert:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          expected: '[]'
          actual: "${{ needs.test.outputs.affected }}"

      - uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          expected: 'false'
          actual: "${{ needs.test.outputs.has-affected-stacks }}"
